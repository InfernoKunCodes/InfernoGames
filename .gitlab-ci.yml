spec:
  inputs:
    force_run:
      type: boolean
      default: false
      description: "Force all stages to run regardless of file changes"
---

# Cancel superseded pipelines. build/deploy are not interruptible on purpose.
workflow:
  auto_cancel:
    on_new_commit: interruptible

stages:
  - test
  - build
  - deploy

variables:
  DOCKER_HOST: "unix:///var/run/docker.sock"
  GIT_STRATEGY: clone
  FORCE_RUN: "$[[ inputs.force_run ]]"

test-rest:
  stage: test
  image: gradle:9.5.1-jdk25-corretto
  allow_failure: true
  interruptible: true
  variables:
    JAVA_TOOLCHAIN_VERSION: "25"
  before_script:
    - dnf install -y python3 --quiet
  script:
    - cd inferno-games-rest
    - gradle test jacocoTestReport --no-daemon --quiet
    - |
      python3 -c "
      import xml.etree.ElementTree as ET
      for c in ET.parse('build/reports/jacoco/test/jacocoTestReport.xml').getroot().findall('counter'):
          if c.get('type') == 'INSTRUCTION':
              m, cv = int(c.get('missed')), int(c.get('covered'))
              print(f'Coverage: {cv/(m+cv)*100:.1f}%')
      "
  coverage: '/Coverage: (\d+\.\d+)%/'
  artifacts:
    when: always
    reports:
      junit: inferno-games-rest/build/reports/tests/test/TEST-*.xml
    paths:
      - inferno-games-rest/build/reports/jacoco/
    expire_in: 30 days
  tags:
    - docker
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $FORCE_RUN == "true"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - inferno-games-rest/**/*
        - .gitlab-ci.yml

test-web:
  stage: test
  image: node:24-slim
  allow_failure: true
  interruptible: true
  variables:
    # Cached so the browser is not re-downloaded every run.
    PUPPETEER_CACHE_DIR: "$CI_PROJECT_DIR/.chrome-cache"
  cache:
    key: chrome-for-testing-131
    paths:
      - .chrome-cache/
  before_script:
    # chromium for its shared libs, unzip for @puppeteer/browsers. Chrome is pinned.
    - apt-get update -q && apt-get install -y -q chromium unzip
    - npm install -g pnpm@11 -q
    - export CHROME_BIN=$(npx --yes @puppeteer/browsers install chrome@131 --path "$PUPPETEER_CACHE_DIR" | tail -1 | awk '{print $NF}')
    - $CHROME_BIN --version
  script:
    - cd inferno-games-web
    - pnpm install -q
    - pnpm test --no-watch --browsers=ChromeHeadlessNoSandbox
  coverage: '/Statements\s+:\s+([\d.]+)/'
  artifacts:
    when: always
    paths:
      - inferno-games-web/coverage/
    expire_in: 30 days
  tags:
    - docker
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $FORCE_RUN == "true"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - inferno-games-web/**/*
        - .gitlab-ci.yml

build-rest:
  stage: build
  image: docker:26.1.4
  before_script:
    - echo $DOCKER_HUB_ACCESS_TOKEN | docker login -u ${DOCKER_HUB_USERNAME} --password-stdin
    - apk add --no-cache nodejs npm bash jq
  script:
    - cd inferno-games-rest
    - npm run docker:build
    - echo "BUILT_REST=true" >> ../build.env
  artifacts:
    reports:
      dotenv: build.env
  tags:
    - docker
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $FORCE_RUN == "true"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - inferno-games-rest/**/*
        - docker-compose.yml
        - .gitlab-ci.yml

build-web:
  stage: build
  image: docker:26.1.4
  services:
    - name: docker:dind
      command: ["--host=tcp://0.0.0.0:2375", "--mtu=1500"]
  before_script:
    - echo $DOCKER_HUB_ACCESS_TOKEN | docker login -u ${DOCKER_HUB_USERNAME} --password-stdin
    - apk add --no-cache nodejs npm bash jq
  script:
    - cd inferno-games-web
    - npm run docker:build
    - echo "BUILT_WEB=true" >> ../build.env
  artifacts:
    reports:
      dotenv: build.env
  tags:
    - docker
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $FORCE_RUN == "true"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - inferno-games-web/**/*
        - docker-compose.yml
        - .gitlab-ci.yml

deploy:
  stage: deploy
  image: ubuntu:22.04
  before_script:
    - apt-get -yq update
    - apt-get -yqq install openssh-client iproute2 || { echo "SSH client installation failed"; exit 1; }
    - mkdir -p ~/.ssh
    - install -m 600 -D /dev/null ~/.ssh/id_rsa
    - echo "$STAGE_SERVER_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$STAGE_SERVER_HOST" >> ~/.ssh/known_hosts
    - export DEPLOY_PATH="/home/$STAGE_SERVER_USER/inferno-games"
  script:
    - echo "Testing SSH connectivity..."
    - ssh-keygen -y -f ~/.ssh/id_rsa | sha256sum
    - ssh -i ~/.ssh/id_rsa "$STAGE_SERVER_USER@$STAGE_SERVER_HOST" "echo Connected"
    - ssh -i ~/.ssh/id_rsa "$STAGE_SERVER_USER@$STAGE_SERVER_HOST" "mkdir -p $DEPLOY_PATH"
    - if [ ! -f docker-compose.yml ]; then echo "docker-compose.yml not found"; exit 1; fi
    - echo "Checking if docker-compose.yml exists on server..."
    - if ssh -i ~/.ssh/id_rsa "$STAGE_SERVER_USER@$STAGE_SERVER_HOST" "test -f $DEPLOY_PATH/docker-compose.yml"; then
        echo "docker-compose.yml already exists on server, skipping copy";
      else
        echo "docker-compose.yml not found on server, copying...";
        scp -i ~/.ssh/id_rsa -r docker-compose.yml "$STAGE_SERVER_USER@$STAGE_SERVER_HOST:$DEPLOY_PATH/.";
      fi
    # Only restart services that were actually built
    - |
      SERVICES_TO_RESTART=""
      if [ -n "$BUILT_REST" ]; then
        SERVICES_TO_RESTART="$SERVICES_TO_RESTART inferno-games-rest"
      fi
      if [ -n "$BUILT_WEB" ]; then
        SERVICES_TO_RESTART="$SERVICES_TO_RESTART inferno-games-web"
      fi

      if [ -n "$SERVICES_TO_RESTART" ]; then
        echo "Restarting services: $SERVICES_TO_RESTART"
        ssh -i ~/.ssh/id_rsa "$STAGE_SERVER_USER@$STAGE_SERVER_HOST" "cd \"$DEPLOY_PATH\" && docker compose pull $SERVICES_TO_RESTART && docker compose up -d $SERVICES_TO_RESTART"
      else
        echo "No services need to be restarted"
      fi
  after_script:
    - rm -rf ~/.ssh
  tags:
    - docker
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - job: build-rest
      optional: true
    - job: build-web
      optional: true
